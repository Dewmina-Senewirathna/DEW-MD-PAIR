<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DEW-MD v1 - ULTIMATE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-green: #00a884;
      --dark-bg: #111b21;
      --light-bg: #202c33;
      --hover-bg: #2a3942;
      --text-color: #e9edef;
      --error-color: #ff4d4d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--text-color);
      height: 100vh;
      overflow: hidden;
    }

    .app-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    .sidebar {
      width: 280px;
      background-color: var(--light-bg);
      padding: 1.5rem 1rem;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .sidebar h2 {
      color: var(--main-green);
      margin-bottom: 2rem;
      font-size: 1.5rem;
      text-align: center;
    }

    .sidebar-menu a {
      display: block;
      color: var(--text-color);
      padding: 0.8rem 1rem;
      margin: 0.5rem 0;
      background-color: var(--hover-bg);
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .sidebar-menu a:hover {
      background-color: var(--main-green);
      color: #fff;
    }

    .main-panel {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      position: relative;
    }

    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .main-header h1 {
      font-size: 2rem;
      color: var(--main-green);
    }

    .menu-toggle {
      display: none;
      font-size: 1.5rem;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    .button-grid {
      margin-top: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .grid-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 1rem;
      background-color: var(--hover-bg);
      color: white;
      border-radius: 8px;
      font-size: 1.1rem;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .grid-button:hover {
      background-color: var(--main-green);
      color: #fff;
    }

    .grid-button.error {
      background-color: rgba(255, 50, 50, 0.3);
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: var(--light-bg);
      font-size: 0.9rem;
      color: #888;
    }

    /* Responsive Mobile */
    @media (max-width: 768px) {
      .app-layout {
        flex-direction: column;
      }

      .sidebar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
        z-index: 1000;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-toggle {
        display: inline-block;
      }

      .main-panel {
        padding: 1rem;
      }

      .sidebar-menu a {
        display: block;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <h2><i class="fas fa-robot"></i> DEW-MD v1</h2>
      <nav class="sidebar-menu">
        <a href="/qr" target="_blank"><i class="fas fa-qrcode"></i> QR-CODE</a>
        <a href="/pair" target="_blank"><i class="fas fa-handshake"></i> Pairing Code</a>
        <a href="https://github.com/hansayalk/hansanew" target="_blank"><i class="fab fa-github"></i> GitHub</a>
        <a href="https://wa.me/+94701515609?text=HAVE_ERROR_HANSA" target="_blank" style="color: var(--error-color);"><i class="fas fa-bug"></i> Report Error</a>
        <a href="https://wa.me/+94701515609?text=Hansa" target="_blank"><i class="fas fa-user-secret"></i> Owner</a>
      </nav>
    </aside>

    <!-- Main Panel -->
    <main class="main-panel">
      <div class="main-header">
        <h1>Session ID Manager</h1>
        <button class="menu-toggle" onclick="toggleSidebar()">
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <div class="button-grid">
        <a href="/qr" class="grid-button" target="_blank"><i class="fas fa-qrcode"></i> QR Code</a>
        <a href="/pair" class="grid-button" target="_blank"><i class="fas fa-handshake"></i> Pairing Code</a>
        <a href="https://github.com/hansayalk/hansanew" class="grid-button" target="_blank"><i class="fab fa-github"></i> Git Repo</a>
        <a href="https://gitlab.com/dew-coders/dew-md-v1/-/raw/main/DEW-MD-V1-main__2_.zip?inline=false" class="grid-button" target="_blank"><i class="fas fa-download"></i> Download ZIP</a>
        <a href="https://whatsapp.com/channel/0029Vb2bFCq0LKZGEl4xEe2G" class="grid-button" target="_blank"><i class="fab fa-whatsapp"></i> WA Channel</a>
        <a href="https://www.youtube.com/channel/UC6RtvfgvOpbABJy8lqNnI5A" class="grid-button" target="_blank"><i class="fab fa-youtube"></i> YouTube</a>
        <a href="https://wa.me/+94701515609?text=HAVE_ERROR_HANSA" class="grid-button error" target="_blank"><i class="fas fa-bug"></i> Report Error</a>
        <a href="https://wa.me/+94701515609?text=Hansa" class="grid-button" target="_blank"><i class="fas fa-user-secret"></i> Contact Owner</a>
      </div>
    </main>
  </div>

  <footer>
    © 2025 DEW MD | Powered by Hansa Dewmina
  </footer>

  <script>
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
    }
  </script>
</body>
</html>
